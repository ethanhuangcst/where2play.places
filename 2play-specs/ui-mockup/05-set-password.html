    <link rel="icon" href="assets/favicon.png" type="image/png" />

  </head>
  <body class="shell-public">
    <a class="sr-only" href="#content">Skip to content</a>
    <main id="content" class="auth-main">
      <div class="auth-card">
        <a class="logo" href="01-home.html" aria-label="where2play.place">
          <span class="mark-host mark-host--plane">
            <svg class="wing-trail" viewBox="0 0 18 10" fill="none" aria-hidden="true">

            <img class="mark mark--plane" src="assets/play-logo.png" alt="" width="40" height="40" />
          </span>
          <span class="logo-word">where2play.place</span>
        </a>
        <h1>Set new password</h1>
        <p class="meta">Choose a password for your where2play account.</p>
        <form class="auth-form" action="03-login.html" method="get">
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="password2">Confirm password</label>
            <input id="password2" name="password2" type="password" autocomplete="new-password" />
          </div>
          <button class="btn" type="submit">Save password</button>
        </form>
      </div>
    </main>
