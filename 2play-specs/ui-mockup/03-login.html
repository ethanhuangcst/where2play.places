<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 — where2play.place</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="assets/mockup.css" />
    <link rel="stylesheet" href="assets/mockup-travor.css" />
  </head>
  <body class="shell-public" data-style="travor">
    <a class="sr-only" href="#content">Skip to content</a>

    <div class="register-shell">
      <header class="register-topbar">
        <a class="logo" href="01-home.html" aria-label="where2play.place">
          <span class="mark-host mark-host--plane">
            <svg class="wing-trail" viewBox="0 0 18 10" fill="none" aria-hidden="true">
              <path d="M17 2.2c-3.2.9-6.5 2.2-10 3.6C4.2 6.8 2.2 7.6 1 8.2" />
            </svg>
            <img class="mark mark--plane" src="assets/play-logo.png" alt="" width="40" height="40" />
          </span>
          <span class="logo-word">where2play.place</span>
        </a>
        <div class="locale-switch" role="group" aria-label="Locale">
          <button type="button">EN</button>
          <button type="button" class="is-on">CN</button>
          <button type="button">HK</button>
          <button type="button">TW</button>
        </div>
      </header>

      <main id="content" class="auth-main auth-main--register">
        <div class="register-card">
          <header class="register-card__head">
            <h1>登录</h1>
            <p class="meta">继续规划去哪玩。</p>
          </header>

          <form class="register-card__form auth-form" action="06-plan.html" method="get">
            <div class="register-card__fields">
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" />
              </div>
              <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" />
              </div>
            </div>

            <div class="register-card__actions">
              <button class="btn register-card__submit" type="submit" data-testid="login-submit">登录</button>
              <p class="auth-links"><a href="04-reset.html">忘记密码？</a> · <a href="02-register.html">创建账号</a></p>
            </div>
          </form>
        </div>
      </main>
    </div>

    <footer class="family-footer">
      <div class="family-footer__inner">
        <nav class="family-footer__row" aria-label="places.family">
          <span class="family-footer__label">places.family:</span>
          <span class="family-footer__current"><img src="assets/play-logo.png" alt="" width="18" height="18" /><span>where2play.place</span></span>
          <span class="family-footer__sep" aria-hidden="true">·</span>
          <a class="family-footer__link" href="../../../2.what2eat/2eat-specs/ui-mockup/01-home.html" target="_blank" rel="noopener noreferrer"><img src="assets/food-logo.png" alt="" width="18" height="18" /><span>what2eat.food</span></a>
          <span class="family-footer__sep" aria-hidden="true">·</span>
          <a class="family-footer__link" href="../../../1.places-agent/agent-specs/ui-mockup/01-home.html" target="_blank" rel="noopener noreferrer"><img src="assets/agent-logo.png" alt="" width="18" height="18" /><span>places.agent-mate.ai</span></a>
        </nav>
        <span class="family-footer__copy">copyright © Ethan Huang</span>
      </div>
    </footer>
    <script src="assets/mockup.js"></script>
  </body>
</html>
