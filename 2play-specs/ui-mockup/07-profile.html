<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人信息 — where2play.place</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="assets/mockup.css" />
    <link rel="stylesheet" href="assets/mockup-travor.css" />
  </head>
  <body class="shell-app" data-style="travor">
    <a class="sr-only" href="#content">Skip to content</a>
    <header class="app-header">
      <div class="app-header__inner">
        <a class="logo" href="06-plan-skeleton.html" aria-label="where2play.place">
          <span class="mark-host mark-host--plane">
            <svg class="wing-trail" viewBox="0 0 18 10" fill="none" aria-hidden="true">
              <path d="M17 2.2c-3.2.9-6.5 2.2-10 3.6C4.2 6.8 2.2 7.6 1 8.2" />
            </svg>
            <img class="mark mark--plane" src="assets/play-logo.png" alt="" width="40" height="40" />
          </span>
          <span class="logo-word">where2play.place</span>
        </a>
        <button type="button" class="menu-toggle btn btn-quiet" data-testid="nav-menu">Menu</button>
        <nav class="app-nav" aria-label="Primary">
          <a href="06-plan-skeleton.html">行程规划</a>
          <a href="08-saved.html">我的行程</a>
          <a href="07-profile.html" class="is-active">个人信息</a>
        </nav>
        <div class="app-user">
          <span class="hello">你好，</span>
          <span class="avatar" aria-hidden="true" title="Mei"><img src="assets/play-logo.png" alt="" /></span>
          <span class="hello hello--name">Mei</span>
          <div class="app-user__tools">
            <div class="locale-switch" role="group" aria-label="Locale">
              <button type="button">EN</button>
              <button type="button" class="is-on">CN</button>
              <button type="button">HK</button>
              <button type="button">TW</button>
            </div>
            <a class="btn btn-quiet" href="01-home.html">登出</a>
          </div>
        </div>
      </div>
    </header>

    <main id="content" class="app-main app-main--profile">
      <h1 class="sr-only">个人信息</h1>

      <div class="profile-stack">
        <div class="register-card">
          <header class="register-card__head">
            <h2>用户资料</h2>
            <p class="meta">上次保存 周一 09:12</p>
          </header>

          <form class="register-card__form" action="07-profile.html" method="get">
            <div class="register-card__fields">
              <p class="register-required-note">标 * 为必填</p>

              <div class="field">
                <label for="name" class="is-required">姓名</label>
                <input id="name" name="name" type="text" autocomplete="name" required value="Mei" />
              </div>

              <div class="field">
                <div class="field-label-row">
                  <label for="email" class="is-required">Email</label>
                  <span class="field-label-note">用于登录账号</span>
                </div>
                <input id="email" name="email" type="email" autocomplete="email" required value="mei@example.com" />
              </div>

              <div class="field-row field-row--demographics">
                <div class="field field--gender">
                  <label for="gender">性别</label>
                  <select id="gender" name="gender">
                    <option value="female" selected>女</option>
                    <option value="male">男</option>
                    <option value="other">其他</option>
                    <option value="skip">不愿透露</option>
                  </select>
                </div>
                <div class="field field--age">
                  <label for="age">年龄</label>
                  <input id="age" name="age" type="number" inputmode="numeric" min="13" max="120" value="28" />
                </div>
              </div>

              <div class="field">
                <label for="nationality">国籍（护照签发国）</label>
                <div class="combo" data-combo data-testid="profile-nationality" data-value="CHN">
                  <input id="nationality" name="nationality" type="text" role="combobox" value="中国" autocomplete="off" />
                  <button type="button" class="combo__toggle" aria-label="打开国籍选项" aria-expanded="false"></button>
                  <ul class="combo__list" role="listbox" aria-label="国籍" hidden>
                    <li role="presentation"><button type="button" role="option" data-value="CHN" aria-selected="true">中国</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="HKG">中国香港</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="TWN">中国台湾</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="USA">美国</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="JPN">日本</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="KOR">韩国</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="SGP">新加坡</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="GBR">英国</button></li>
                    <li role="presentation"><button type="button" role="option" data-value="FRA">法国</button></li>
                  </ul>
                </div>
              </div>

              <div class="field">
                <label for="location" class="is-required">常用出发地</label>
                <div class="location-with-action">
                  <div class="location-field">
                    <input id="location" name="location" type="text" value="台北" placeholder="城市或区域" autocomplete="off" required />
                    <button type="button" class="location-detect" aria-label="使用当前位置">
                      <svg class="icon-locate" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
                      </svg>
                    </button>
                  </div>
                  <a class="btn btn-quiet location-with-action__reset" href="04-reset.html">重置密码</a>
                </div>
              </div>

              <div class="field" data-field="interests">
                <label id="interests-label">出行兴趣（多选）</label>
                <div class="chip-row" role="group" aria-labelledby="interests-label">
                  <button type="button" class="chip is-on">景点</button>
                  <button type="button" class="chip is-on">美食</button>
                  <button type="button" class="chip">博物馆</button>
                  <button type="button" class="chip">公园</button>
                  <button type="button" class="chip">寺庙</button>
                  <button type="button" class="chip is-on">夜市</button>
                  <button type="button" class="chip">购物</button>
                  <button type="button" class="chip">温泉</button>
                  <button type="button" class="chip">户外</button>
                </div>
              </div>
            </div>

            <div class="register-card__actions">
              <button class="btn register-card__submit" type="submit" data-testid="profile-save">保存资料</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer class="family-footer family-footer--app">
      <div class="family-footer__inner">
        <nav class="family-footer__row" aria-label="places.family">
          <span class="family-footer__label">places.family:</span>
          <span class="family-footer__current"><img src="assets/play-logo.png" alt="" width="18" height="18" /><span>where2play.place</span></span>
          <span class="family-footer__sep" aria-hidden="true">·</span>
          <a class="family-footer__link" href="../../../2.what2eat/2eat-specs/ui-mockup/01-home.html" target="_blank" rel="noopener noreferrer"><img src="assets/food-logo.png" alt="" width="18" height="18" /><span>what2eat.food</span></a>
          <span class="family-footer__sep" aria-hidden="true">·</span>
          <a class="family-footer__link" href="../../../1.places-agent/agent-specs/ui-mockup/01-home.html" target="_blank" rel="noopener noreferrer"><img src="assets/agent-logo.png" alt="" width="18" height="18" /><span>places.agent-mate.ai</span></a>
        </nav>
        <span class="family-footer__copy">copyright © Ethan Huang</span>
      </div>
    </footer>
    <script src="assets/mockup.js"></script>
  </body>
</html>
